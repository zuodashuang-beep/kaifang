name: Sync IPTV

on:
  schedule:
    # 每 6 小时执行一次
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-iptv
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download IPTV sources
        shell: bash
        run: |
          set -euo pipefail

          download() {
            local url="$1"
            local output="$2"

            curl \
              --fail \
              --location \
              --silent \
              --show-error \
              --retry 3 \
              --retry-all-errors \
              --connect-timeout 20 \
              --max-time 180 \
              "$url" \
              --output "$output"

            if [ ! -s "$output" ]; then
              echo "下载失败或内容为空：$url"
              exit 1
            fi
          }

          download \
            "https://live.zbds.top/tv/iptv4.txt" \
            "source-1.txt"

          download \
            "https://raw.githubusercontent.com/suxuang/myIPTV/main/ipv4.m3u" \
            "source-2.m3u"

          download \
            "https://live.445569.xyz/live.m3u" \
            "source-3.m3u"

      - name: Parse and check links
        shell: bash
        run: |
          python3 - <<'PY'
          import concurrent.futures
          import re
          import subprocess
          import sys
          import unicodedata
          from collections import OrderedDict
          from pathlib import Path

          CONNECT_TIMEOUT = 6
          TOTAL_TIMEOUT = 12
          MAX_WORKERS = 32

          entries = []
          seen_urls = set()

          def read_text(path):
              return Path(path).read_text(
                  encoding="utf-8",
                  errors="ignore",
              ).replace("\r\n", "\n")

          def extract_attribute(text, name):
              pattern = rf'{re.escape(name)}="([^"]*)"'
              match = re.search(
                  pattern,
                  text,
                  flags=re.IGNORECASE,
              )
              return match.group(1).strip() if match else None

          def normalize_name(name):
              name = unicodedata.normalize("NFKC", name)
              name = name.strip()

              # 删除名称两端的常见质量标识
              name = re.sub(
                  r"[\[\(（【]\s*"
                  r"(?:高清|超清|标清|蓝光|HD|FHD)"
                  r"\s*[\]\)）】]",
                  "",
                  name,
                  flags=re.IGNORECASE,
              )

              name = re.sub(
                  r"[\s\-_]+(?:高清|超清|标清|HD|FHD)$",
                  "",
                  name,
                  flags=re.IGNORECASE,
              )

              # 统一 CCTV 写法
              name = re.sub(
                  r"^(?:央视|CCTV)[\s\-_]*(\d+)"
                  r"[\s\-_]*(?:PLUS|P|\+)",
                  lambda m: f"CCTV{m.group(1)}+",
                  name,
                  flags=re.IGNORECASE,
              )

              name = re.sub(
                  r"^(?:央视|CCTV)[\s\-_]*(\d+)",
                  lambda m: f"CCTV{m.group(1)}",
                  name,
                  flags=re.IGNORECASE,
              )

              name = re.sub(
                  r"^CCTV[\s\-_]*",
                  "CCTV",
                  name,
                  flags=re.IGNORECASE,
              )

              # 统一常见频道名称
              replacements = {
                  "中央一套": "CCTV1",
                  "中央二套": "CCTV2",
                  "中央三套": "CCTV3",
                  "中央四套": "CCTV4",
                  "中央五套": "CCTV5",
                  "中央六套": "CCTV6",
                  "中央七套": "CCTV7",
                  "中央八套": "CCTV8",
                  "中央九套": "CCTV9",
                  "中央十套": "CCTV10",
                  "中央十一套": "CCTV11",
                  "中央十二套": "CCTV12",
                  "中央十三套": "CCTV13",
                  "中央十四套": "CCTV14",
                  "中央十五套": "CCTV15",
                  "中央十六套": "CCTV16",
                  "中央十七套": "CCTV17",
                  "CCTV5PLUS": "CCTV5+",
                  "CCTV5P": "CCTV5+",
              }

              upper_name = name.upper()

              if upper_name in replacements:
                  name = replacements[upper_name]
              elif name in replacements:
                  name = replacements[name]

              # 合并多余空格
              name = re.sub(r"\s+", " ", name).strip()

              return name or "未命名频道"

          def normalize_group(group, channel_name):
              text = f"{group} {channel_name}"

              if re.search(
                  r"CCTV|央视|中央电视台|CGTN|CETV",
                  text,
                  flags=re.IGNORECASE,
              ):
                  return "央视频道"

              if "卫视" in text:
                  return "卫视频道"

              if re.search(
                  r"香港|澳门|台湾|TVB|凤凰",
                  text,
                  flags=re.IGNORECASE,
              ):
                  return "港澳台频道"

              if re.search(
                  r"地方|市台|县台|省内",
                  text,
                  flags=re.IGNORECASE,
              ):
                  return "地方频道"

              return "其他频道"

          def add_entry(
              group,
              name,
              url,
              user_agent=None,
              referer=None,
          ):
              name = normalize_name(name)
              url = url.strip()

              if not url.lower().startswith(
                  ("http://", "https://")
              ):
                  return

              # 完全相同的播放地址只保留一次
              if url in seen_urls:
                  return

              seen_urls.add(url)

              entries.append({
                  "group": normalize_group(group, name),
                  "name": name,
                  "url": url,
                  "user_agent": user_agent,
                  "referer": referer,
              })

          def parse_txt(path):
              current_group = "其他频道"

              for original_line in read_text(path).splitlines():
                  line = original_line.strip()

                  if not line:
                      continue

                  if line.endswith(",#genre#"):
                      current_group = line.rsplit(",", 1)[0]
                      continue

                  if "," not in line:
                      continue

                  name, url = line.split(",", 1)

                  add_entry(
                      current_group,
                      name,
                      url,
                  )

          def parse_m3u(path):
              pending = None

              for original_line in read_text(path).splitlines():
                  line = original_line.strip()

                  if not line:
                      continue

                  if line.startswith("#EXTINF:"):
                      name = (
                          line.rsplit(",", 1)[1].strip()
                          if "," in line
                          else "未命名频道"
                      )

                      pending = {
                          "name": name,
                          "group": (
                              extract_attribute(
                                  line,
                                  "group-title",
                              )
                              or "其他频道"
                          ),
                          "user_agent": (
                              extract_attribute(
                                  line,
                                  "http-user-agent",
                              )
                              or extract_attribute(
                                  line,
                                  "user-agent",
                              )
                          ),
                          "referer": (
                              extract_attribute(
                                  line,
                                  "http-referer",
                              )
                              or extract_attribute(
                                  line,
                                  "http-referrer",
                              )
                          ),
                      }
                      continue

                  # 忽略注释和被注释掉的链接
                  if line.startswith("#"):
                      continue

                  if (
                      pending
                      and line.lower().startswith(
                          ("http://", "https://")
                      )
                  ):
                      add_entry(
                          pending["group"],
                          pending["name"],
                          line,
                          pending["user_agent"],
                          pending["referer"],
                      )
                      pending = None

          parse_txt("source-1.txt")
          parse_m3u("source-2.m3u")
          parse_m3u("source-3.m3u")

          if not entries:
              print("没有解析到播放链接")
              sys.exit(1)

          def check_url(entry):
              command = [
                  "curl",
                  "--location",
                  "--silent",
                  "--show-error",
                  "--connect-timeout",
                  str(CONNECT_TIMEOUT),
                  "--max-time",
                  str(TOTAL_TIMEOUT),
                  "--range",
                  "0-2047",
                  "--max-filesize",
                  "65536",
                  "--output",
                  "/dev/null",
                  "--write-out",
                  "%{http_code}|%{size_download}",
              ]

              if entry["user_agent"]:
                  command.extend([
                      "--user-agent",
                      entry["user_agent"],
                  ])

              if entry["referer"]:
                  command.extend([
                      "--referer",
                      entry["referer"],
                  ])

              command.append(entry["url"])

              try:
                  result = subprocess.run(
                      command,
                      stdout=subprocess.PIPE,
                      stderr=subprocess.DEVNULL,
                      text=True,
                      timeout=TOTAL_TIMEOUT + 3,
                  )

                  output = result.stdout.strip()
                  parts = output.split("|")

                  if len(parts) != 2:
                      return entry, False

                  try:
                      status_code = int(parts[0])
                      downloaded = float(parts[1])
                  except ValueError:
                      return entry, False

                  # HTTP 成功并且确实返回了内容
                  reachable = (
                      200 <= status_code < 400
                      and downloaded > 0
                  )

                  return entry, reachable

              except Exception:
                  return entry, False

          reachable_entries = []
          total = len(entries)

          print(f"共解析到 {total} 条唯一播放地址")

          with concurrent.futures.ThreadPoolExecutor(
              max_workers=MAX_WORKERS
          ) as executor:
              futures = [
                  executor.submit(check_url, entry)
                  for entry in entries
              ]

              for index, future in enumerate(
                  concurrent.futures.as_completed(futures),
                  start=1,
              ):
                  entry, reachable = future.result()

                  if reachable:
                      reachable_entries.append(entry)
                      status = "连通"
                  else:
                      status = "失效"

                  print(
                      f"[{index}/{total}] "
                      f"{status}：{entry['name']}"
                  )

          if len(reachable_entries) < 10:
              print(
                  f"只检测到 {len(reachable_entries)} 条连通链接，"
                  "可能发生网络异常，拒绝覆盖原文件。"
              )
              sys.exit(1)

          group_order = {
              "央视频道": 0,
              "卫视频道": 1,
              "地方频道": 2,
              "港澳台频道": 3,
              "其他频道": 4,
          }

          def natural_sort_key(entry):
              name = entry["name"]

              cctv_match = re.match(
                  r"^CCTV(\d+)(\+)?(.*)$",
                  name,
                  flags=re.IGNORECASE,
              )

              if cctv_match:
                  return (
                      group_order[entry["group"]],
                      0,
                      int(cctv_match.group(1)),
                      1 if cctv_match.group(2) else 0,
                      cctv_match.group(3),
                      entry["url"],
                  )

              parts = re.split(r"(\d+)", name)

              natural_name = tuple(
                  int(part) if part.isdigit()
                  else part.lower()
                  for part in parts
              )

              return (
                  group_order[entry["group"]],
                  1,
                  natural_name,
                  entry["url"],
              )

          reachable_entries.sort(key=natural_sort_key)

          grouped = OrderedDict(
              (group, [])
              for group in group_order
          )

          for entry in reachable_entries:
              grouped[entry["group"]].append(entry)

          output_lines = []

          for group, group_entries in grouped.items():
              if not group_entries:
                  continue

              if output_lines:
                  output_lines.append("")

              output_lines.append(f"{group},#genre#")

              for entry in group_entries:
                  output_lines.append(
                      f"{entry['name']},{entry['url']}"
                  )

          Path("IPTV_OK.txt.tmp").write_text(
              "\n".join(output_lines) + "\n",
              encoding="utf-8",
          )

          print(
              f"检测完成："
              f"{len(reachable_entries)}/{total} 条链接可以连接"
          )
          PY

      - name: Replace IPTV_OK.txt
        shell: bash
        run: |
          set -euo pipefail

          mv IPTV_OK.txt.tmp IPTV_OK.txt
          rm -f source-1.txt source-2.m3u source-3.m3u

      - name: Commit and push changes
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- IPTV_OK.txt; then
            echo "内容没有变化，无需提交"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add IPTV_OK.txt
          git commit -m "自动合并并检测 IPTV 链接"
          git push
