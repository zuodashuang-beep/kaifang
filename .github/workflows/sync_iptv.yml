name: Sync IPTV

on:
  schedule:
    # 每 6 小时运行一次（UTC 时间）
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-iptv
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download IPTV data
        shell: bash
        run: |
          set -euo pipefail

          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            --retry 3 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 180 \
            "https://live.zbds.top/tv/iptv4.txt" \
            --output IPTV_OK.txt.tmp

          if [ ! -s IPTV_OK.txt.tmp ]; then
            echo "下载失败：文件为空"
            exit 1
          fi

          mv IPTV_OK.txt.tmp IPTV_OK.txt

      - name: Commit and push changes
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- IPTV_OK.txt; then
            echo "内容没有变化，无需提交"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add IPTV_OK.txt
          git commit -m "自动同步 IPTV 数据"
          git push
